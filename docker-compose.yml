# KorUZ Mall — development stack
# Usage:
#   cp .env.example .env
#   docker compose up -d --build
#
# All services attach to the internal `koruz-net` bridge network. In
# development we expose Postgres, Redis, and MinIO ports to the host so the
# API can be run locally outside Docker if needed.

name: koruz-mall

x-api-base: &api-base
  build:
    context: ./api
    dockerfile: Dockerfile
    target: development
  image: koruz-mall/api:dev
  env_file:
    - .env
  environment:
    ENVIRONMENT: development
    PYTHONPATH: /app
  volumes:
    - ./api:/app
  networks:
    - koruz-net
  restart: unless-stopped

services:
  nginx:
    image: nginx:alpine
    container_name: koruz-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/koruz.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - api
    networks:
      - koruz-net

  api:
    <<: *api-base
    container_name: koruz-api
    expose:
      - "8000"
    command: >
      uvicorn main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --proxy-headers
      --forwarded-allow-ips=*
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    <<: *api-base
    container_name: koruz-worker
    command: celery -A workers.celery_app worker --loglevel=info --concurrency=2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  beat:
    <<: *api-base
    container_name: koruz-beat
    command: celery -A workers.celery_app beat --loglevel=info
    depends_on:
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: koruz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-koruz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-koruz}
      POSTGRES_DB: ${POSTGRES_DB:-koruz}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-koruz} -d ${POSTGRES_DB:-koruz}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - koruz-net

  redis:
    image: redis:7-alpine
    container_name: koruz-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - koruz-net

  minio:
    image: minio/minio:latest
    container_name: koruz-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - koruz-net

  # One-shot job: ensures the required buckets exist and the documents bucket
  # is private (presigned-URL access only).
  minio-init:
    image: minio/mc:latest
    container_name: koruz-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      MINIO_BUCKET_DOCUMENTS: ${MINIO_BUCKET_DOCUMENTS:-seller-documents}
      MINIO_BUCKET_IMAGES: ${MINIO_BUCKET_IMAGES:-product-images}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY"
        mc mb --ignore-existing "local/$$MINIO_BUCKET_DOCUMENTS"
        mc mb --ignore-existing "local/$$MINIO_BUCKET_IMAGES"
        mc anonymous set none     "local/$$MINIO_BUCKET_DOCUMENTS"
        mc anonymous set download "local/$$MINIO_BUCKET_IMAGES"
        echo "MinIO buckets ready."
    networks:
      - koruz-net
    restart: "no"

  prometheus:
    image: prom/prometheus:latest
    container_name: koruz-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - koruz-net

  grafana:
    image: grafana/grafana:latest
    container_name: koruz-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - koruz-net

volumes:
  postgres-data:
  redis-data:
  minio-data:
  prometheus-data:
  grafana-data:
  nginx-logs:

networks:
  koruz-net:
    driver: bridge
