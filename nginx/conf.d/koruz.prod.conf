# KorUZ Mall — production server block.
# HTTP -> HTTPS redirect plus TLS-terminating HTTPS server. Mounted as
# /etc/nginx/conf.d/default.conf by docker-compose.prod.yml.
#
# Required on host before `docker compose up` will succeed:
#   ./nginx/certs/fullchain.pem
#   ./nginx/certs/privkey.pem
#
# (Use Let's Encrypt / certbot, your CA, or a wildcard — Nginx only cares
# that both files exist and form a valid chain.)

# -----------------------------------------------------------------------------
# HTTP — redirect everything to HTTPS, leave the ACME http-01 path open so
# certbot renewals can complete without taking nginx down.
# -----------------------------------------------------------------------------
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
# HTTPS — main public entrypoint.
# -----------------------------------------------------------------------------
server {
    listen      443 ssl default_server;
    listen      [::]:443 ssl default_server;
    http2       on;
    server_name _;

    # ---- TLS ----------------------------------------------------------------
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers             ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache       shared:SSL:10m;
    ssl_session_timeout     1d;
    ssl_session_tickets     off;

    ssl_stapling            on;
    ssl_stapling_verify     on;
    resolver                1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout        5s;

    # ---- Security headers ---------------------------------------------------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy   "default-src 'none'; frame-ancestors 'none'" always;

    # ---- Rate / connection limits ------------------------------------------
    limit_conn conn_per_ip 50;

    location ~ ^/api/v1/auth/(login|register|refresh)$ {
        limit_req zone=auth_zone burst=5 nodelay;
        proxy_pass http://koruz_api;
    }

    location /api/v1/admin/ {
        limit_req zone=admin_zone burst=20 nodelay;
        proxy_pass http://koruz_api;
    }

    location /api/ {
        limit_req zone=public_zone burst=50 nodelay;
        proxy_pass http://koruz_api;
    }

    location = /health {
        access_log off;
        proxy_pass http://koruz_api/health;
    }

    # Prometheus scrape — restricted to internal docker network ranges.
    location = /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        deny  all;
        access_log off;
        proxy_pass http://koruz_api/metrics;
    }

    # OpenAPI docs MUST NOT be exposed in production. Belt + suspenders:
    # FastAPI should set `docs_url=None, redoc_url=None` in main.py for
    # ENVIRONMENT=production, and nginx returns 404 here regardless.
    location ~ ^/(docs|redoc|openapi\.json)(/.*)?$ {
        return 404;
    }

    # Default deny — keeps unrelated probes off the API.
    location / {
        return 404;
    }
}
