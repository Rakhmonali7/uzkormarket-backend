# KorUZ Mall — development server block.
# HTTP only on port 80; no TLS in dev. Mounted as
# /etc/nginx/conf.d/default.conf by docker-compose.yml.

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    # Cap concurrent connections per IP.
    limit_conn conn_per_ip 50;

    # ----- Auth: stricter rate limit (login/register/refresh are the abuse
    # surfaces). Burst lets a legitimate user retry a typo without 429s.
    location ~ ^/api/v1/auth/(login|register|refresh)$ {
        limit_req zone=auth_zone burst=5 nodelay;
        proxy_pass http://koruz_api;
    }

    # ----- Admin: ADMIN role check still happens in FastAPI; this is a
    # defence-in-depth limit, not authorization.
    location /api/v1/admin/ {
        limit_req zone=admin_zone burst=20 nodelay;
        proxy_pass http://koruz_api;
    }

    # ----- Public API surface
    location /api/ {
        limit_req zone=public_zone burst=50 nodelay;
        proxy_pass http://koruz_api;
    }

    # ----- Liveness — never rate-limited, never logged
    location = /health {
        access_log off;
        proxy_pass http://koruz_api/health;
    }

    # ----- Prometheus scrape — internal docker network only
    location = /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny  all;
        access_log off;
        proxy_pass http://koruz_api/metrics;
    }

    # ----- OpenAPI docs — convenient in dev, disabled in prod
    location ~ ^/(docs|redoc|openapi\.json)(/.*)?$ {
        proxy_pass http://koruz_api;
    }

    # Anything else is 404 — don't leak that we proxy through nginx.
    location / {
        return 404;
    }
}
