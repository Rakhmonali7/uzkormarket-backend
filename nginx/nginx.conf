# KorUZ Mall — main Nginx config (shared between dev and prod).
#
# The environment-specific server blocks live in conf.d/koruz.{dev,prod}.conf
# and are mounted as /etc/nginx/conf.d/default.conf by the appropriate
# docker-compose file.

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 8192;

error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---------------------------------------------------------------------
    # Logging
    # ---------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    '"$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # ---------------------------------------------------------------------
    # Performance / hardening
    # ---------------------------------------------------------------------
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    server_tokens      off;

    # Product images are uploaded directly to MinIO via presigned PUT URLs,
    # so nginx never proxies the bytes. 10MB is plenty for JSON request
    # bodies (orders, etc).
    client_max_body_size  10m;
    client_body_timeout   30s;
    client_header_timeout 30s;
    send_timeout          30s;

    # ---------------------------------------------------------------------
    # Compression
    # ---------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/rss+xml
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # ---------------------------------------------------------------------
    # Real client IP — adjust set_real_ip_from if you put a CDN / ALB in
    # front of nginx. Defaults below cover docker bridge / overlay networks.
    # ---------------------------------------------------------------------
    set_real_ip_from   10.0.0.0/8;
    set_real_ip_from   172.16.0.0/12;
    set_real_ip_from   192.168.0.0/16;
    real_ip_header     X-Forwarded-For;
    real_ip_recursive  on;

    # ---------------------------------------------------------------------
    # Rate-limit zones — actual `limit_req` directives live in the per-env
    # server block. Project rule: ~100 req/min per IP for public routes.
    # ---------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=public_zone:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=auth_zone:10m   rate=10r/m;
    limit_req_zone $binary_remote_addr zone=admin_zone:10m  rate=60r/m;
    limit_req_status 429;

    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
    limit_conn_status 429;

    # ---------------------------------------------------------------------
    # Upstream — FastAPI service inside the docker network.
    # `keepalive` requires HTTP/1.1 + empty Connection header on proxied
    # requests (set in the location blocks below).
    # ---------------------------------------------------------------------
    upstream koruz_api {
        server api:8000;
        keepalive 32;
    }

    # ---------------------------------------------------------------------
    # Proxy defaults — inherited by every server/location block.
    # ---------------------------------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host  $host;
    proxy_set_header   X-Forwarded-Port  $server_port;
    proxy_set_header   Connection        "";

    proxy_buffering         on;
    proxy_buffer_size       8k;
    proxy_buffers           16 8k;
    proxy_connect_timeout   5s;
    proxy_send_timeout      60s;
    proxy_read_timeout      60s;
    proxy_next_upstream     error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;

    # ---------------------------------------------------------------------
    # Per-environment server blocks
    # ---------------------------------------------------------------------
    include /etc/nginx/conf.d/*.conf;
}
