# KorUZ Mall — production stack (standalone file).
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
# Differences from the development compose file:
#   - API/worker images are built with target=production (no source mount, no --reload)
#   - Postgres / Redis / MinIO ports are NOT published to the host
#   - Grafana is bound to localhost only; reach it through an SSH tunnel
#   - Required secrets (POSTGRES_PASSWORD, MINIO credentials, JWT_SECRET_KEY,
#     GRAFANA_PASSWORD) MUST be provided through the .env file — there are no
#     development defaults
#   - All services use restart: always

name: koruz-mall-prod

x-api-base: &api-base
  build:
    context: ./api
    dockerfile: Dockerfile
    target: production
  image: koruz-mall/api:${API_IMAGE_TAG:-latest}
  env_file:
    - .env
  environment:
    ENVIRONMENT: production
    PYTHONPATH: /app
  networks:
    - koruz-net
  restart: always

services:
  nginx:
    image: nginx:alpine
    container_name: koruz-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/koruz.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - api
    networks:
      - koruz-net

  api:
    <<: *api-base
    container_name: koruz-api
    expose:
      - "8000"
    command: >
      gunicorn main:app
      -k uvicorn.workers.UvicornWorker
      -b 0.0.0.0:8000
      --workers ${API_WORKERS:-4}
      --timeout 60
      --keep-alive 5
      --access-logfile -
      --error-logfile -
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    <<: *api-base
    container_name: koruz-worker
    command: >
      celery -A workers.celery_app worker
      --loglevel=warning
      --concurrency=${WORKER_CONCURRENCY:-4}
      --max-tasks-per-child=200
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  beat:
    <<: *api-base
    container_name: koruz-beat
    command: celery -A workers.celery_app beat --loglevel=warning
    depends_on:
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: koruz-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - koruz-net

  redis:
    image: redis:7-alpine
    container_name: koruz-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - koruz-net

  minio:
    image: minio/minio:latest
    container_name: koruz-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_CONSOLE_URL:-}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - koruz-net

  minio-init:
    image: minio/mc:latest
    container_name: koruz-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_DOCUMENTS: ${MINIO_BUCKET_DOCUMENTS:-seller-documents}
      MINIO_BUCKET_IMAGES: ${MINIO_BUCKET_IMAGES:-product-images}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY"
        mc mb --ignore-existing "local/$$MINIO_BUCKET_DOCUMENTS"
        mc mb --ignore-existing "local/$$MINIO_BUCKET_IMAGES"
        mc anonymous set none     "local/$$MINIO_BUCKET_DOCUMENTS"
        mc anonymous set download "local/$$MINIO_BUCKET_IMAGES"
    networks:
      - koruz-net
    restart: "no"

  prometheus:
    image: prom/prometheus:latest
    container_name: koruz-prometheus
    restart: always
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - koruz-net

  grafana:
    image: grafana/grafana:latest
    container_name: koruz-grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:?GRAFANA_USER is required}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-}
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - koruz-net

volumes:
  postgres-data:
  redis-data:
  minio-data:
  prometheus-data:
  grafana-data:
  nginx-logs:

networks:
  koruz-net:
    driver: bridge
