# KorUZ Mall — Alembic configuration.
#
# Migrations are run with the SYNC psycopg driver. The async asyncpg driver is
# only used by the FastAPI app at runtime — there's no benefit to async I/O
# for one-shot DDL execution, and a sync env.py is simpler / more debuggable.

[alembic]
# Script directory (relative to this file).
script_location = alembic

# Make the project root importable so env.py can do `from core.config import settings`
# and `import models`. `.` resolves to whatever directory `alembic` is invoked from
# (in our case the api/ folder).
prepend_sys_path = .

# Sortable revision filenames: 20260427_1700_<rev>_<slug>.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# All timestamps in revisions use UTC.
timezone = UTC

# Cap slug length so filenames stay reasonable.
truncate_slug_length = 40

# DSN is injected by env.py from core.config.settings. Leaving the key empty
# here ensures Alembic doesn't accidentally fall back to a stale value.
sqlalchemy.url =

# Run autogen-friendly comparisons.
# (These are mirrored in env.py for the online path; setting them here makes
# offline `--sql` rendering use the same comparison rules.)
compare_type = true
compare_server_default = true


# ----------------------------------------------------------------------------
# Logging
# ----------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
